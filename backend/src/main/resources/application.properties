spring.application.name=LocalSecureCam

# ===== Storage =====
# Where CCTV footage is stored. Point this at your mounted pendrive/SSD.
app.recordings-dir=/mnt/cctv/recordings

# ===== Cameras (id -> RTSP URL) =====
app.cameras.camera1=rtsp://192.168.31.196:554/
app.cameras.camera2=rtsp://192.168.31.107:554/

# ===== Live preview tuning (kept light so it doesn't starve recording) =====
app.stream.fps=5
app.stream.scale-width=640
app.stream.quality=8

# ===== Dashboard / API auth (HTTP Basic) =====
# CHANGE THESE before exposing the Pi to your network.
app.auth.username=admin
app.auth.password=changeme
