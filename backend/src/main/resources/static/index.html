<!DOCTYPE html>
<html>

<head>

<title>LocalSecureCam Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
margin:0;
padding:30px;
}

.container{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:10px;
font-size:18px;
}

.value{
font-size:28px;
margin-top:10px;
}

.chart-box{
margin-top:40px;
background:#1e293b;
padding:20px;
border-radius:10px;
}

.cameras{
margin-top:40px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.cameras img{
width:100%;
border-radius:10px;
background:#000;
}

</style>

</head>

<body>

<h1>📷 LocalSecureCam Dashboard</h1>

<div class="container">

<div class="card">
CPU
<div class="value" id="cpu">--</div>
</div>

<div class="card">
RAM
<div class="value" id="ram">--</div>
</div>

<div class="card">
Temperature
<div class="value" id="temp">--</div>
</div>

<div class="card">
Storage
<div class="value" id="disk">--</div>
</div>

</div>

<div class="chart-box">
<canvas id="cpuChart"></canvas>
</div>

<h2>Live View</h2>
<div class="cameras">
<img src="/api/stream/camera1" alt="camera1">
<img src="/api/stream/camera2" alt="camera2">
</div>

<script>

const cpuEl = document.getElementById("cpu")
const ramEl = document.getElementById("ram")
const tempEl = document.getElementById("temp")
const diskEl = document.getElementById("disk")

const chart = new Chart(
document.getElementById("cpuChart"),
{
type:"line",
data:{
labels:[],
datasets:[{
label:"CPU %",
data:[],
borderColor:"#22c55e",
fill:false,
tension:0.3
}]
},
options:{
scales:{
y:{
min:0,
max:100
}
}
}
})

async function loadStats(){

try{

const res = await fetch("/api/system-stats")

const data = await res.json()

cpuEl.innerText = data.cpu.toFixed(1)+"%"
ramEl.innerText = data.ram.toFixed(1)+"%"
tempEl.innerText = data.temperature.toFixed(1)+"°C"
diskEl.innerText = data.disk.toFixed(1)+"%"

chart.data.labels.push("")
chart.data.datasets[0].data.push(data.cpu)

if(chart.data.labels.length>30){
chart.data.labels.shift()
chart.data.datasets[0].data.shift()
}

chart.update()

}catch(e){

console.log("API error",e)

}

}

setInterval(loadStats,2000)

loadStats()

</script>

</body>
</html>
