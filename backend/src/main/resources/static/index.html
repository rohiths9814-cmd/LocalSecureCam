<!DOCTYPE html>
<html>

<head>

<title>LocalSecureCam Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
margin:0;
padding:30px;
}

h1{
margin-bottom:30px;
}

.container{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:12px;
font-size:20px;
}

.value{
font-size:28px;
margin-top:10px;
}

.chart-container{
margin-top:40px;
background:#1e293b;
padding:20px;
border-radius:12px;
}

</style>

</head>

<body>

<h1>📷 LocalSecureCam Dashboard</h1>

<div class="container">

<div class="card">
CPU
<div class="value" id="cpu">--</div>
</div>

<div class="card">
RAM
<div class="value" id="ram">--</div>
</div>

<div class="card">
Temperature
<div class="value" id="temp">--</div>
</div>

<div class="card">
Storage
<div class="value" id="disk">--</div>
</div>

</div>

<div class="chart-container">

<canvas id="cpuChart"></canvas>

</div>

<script>

const cpuEl = document.getElementById("cpu");
const ramEl = document.getElementById("ram");
const tempEl = document.getElementById("temp");
const diskEl = document.getElementById("disk");

const ctx = document.getElementById("cpuChart");

const cpuData = [];

const cpuChart = new Chart(ctx,{
type:"line",
data:{
labels:[],
datasets:[{
label:"CPU %",
data:cpuData,
borderColor:"#22c55e",
backgroundColor:"rgba(34,197,94,0.2)",
tension:0.4
}]
},
options:{
scales:{
y:{
min:0,
max:100
}
}
}
});

async function loadStats(){

try{

const res = await fetch("/api/system/stats");

const data = await res.json();

cpuEl.innerText = data.cpu.toFixed(1) + "%";
ramEl.innerText = data.ram.toFixed(1) + "%";
tempEl.innerText = data.temperature.toFixed(1) + " °C";
diskEl.innerText = data.disk.toFixed(1) + "%";

cpuData.push(data.cpu);

if(cpuData.length > 30){
cpuData.shift();
}

cpuChart.data.labels.push("");

if(cpuChart.data.labels.length > 30){
cpuChart.data.labels.shift();
}

cpuChart.update();

}catch(e){

console.log("API error");

}

}

setInterval(loadStats,2000);

loadStats();

</script>

</body>

</html>
